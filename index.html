<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subway Surfers Clone</title>
    <style>
        body {
            margin: 0; padding: 0; overflow: hidden;
            background-color: #87CEEB; /* Sky blue */
            font-family: 'Arial', sans-serif;
            touch-action: none;
            user-select: none;
        }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none; flex-direction: column;
            justify-content: center; align-items: center;
            color: white; z-index: 10;
        }
        
        #ui {
            position: absolute; top: 20px; width: 100%;
            display: flex; justify-content: space-around;
            color: white; font-size: 24px; font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
            z-index: 5;
        }

        .menu-btn {
            background: #ffcc00; color: #333; border: none;
            padding: 15px 40px; font-size: 24px; font-weight: bold;
            border-radius: 10px; cursor: pointer; margin: 10px;
            box-shadow: 0 4px 0 #cc9900;
        }
        .menu-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #cc9900; }
    </style>
    <script src="three.min.js"></script>
</head>
<body>

    <div id="startScreen" class="screen" style="display: flex;">
        <h1 style="font-size: 48px; color: #ffcc00; text-shadow: 3px 3px 0 #333;">SUBWAY SURFERS</h1>
        <button class="menu-btn" onclick="startGame()">START</button>
    </div>

    <div id="ui" style="display: none;">
        <div>SCORE: <span id="score">0</span></div>
        <div>COINS: <span id="coins">0</span></div>
    </div>

    <div id="gameOverScreen" class="screen">
        <h1 style="font-size: 48px; color: #ff4444;">GAME OVER</h1>
        <p style="font-size: 24px;">Score: <span id="finalScore">0</span></p>
        <button class="menu-btn" onclick="restartGame()">RETRY</button>
    </div>

    <script>
        // Game Variables
        let scene, camera, renderer, clock;
        let gameRunning = false;
        let score = 0;
        let coins = 0;
        let speed = 20; // Units per second

        // Player variables
        let player;
        let currentLane = 1; // 0: left, 1: middle, 2: right
        let isJumping = false;
        let jumpVelocity = 0;
        const gravity = 0.015;
        const jumpForce = 0.4;
        let isRolling = false;
        let rollTimer = 0;

        // Obstacles & Coins
        let obstacles = [];
        let collectibleCoins = [];
        let spawnTimer = 0;

        // Touch controls
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;

        // Configuration
        const LANES = [-4, 0, 4];

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 20, 100);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);
            camera.lookAt(0, 2, -5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
            sunLight.position.set(10, 20, 10);
            sunLight.castShadow = true;
            sunLight.shadow.camera.left = -20;
            sunLight.shadow.camera.right = 20;
            sunLight.shadow.camera.top = 20;
            sunLight.shadow.camera.bottom = -20;
            scene.add(sunLight);

            // Player
            createPlayer();

            // Ground / Tracks
            createEnvironment();

            window.addEventListener('resize', onWindowResize, false);
            window.addEventListener('keydown', handleKeyDown);
            
            // Touch events
            window.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }, false);

            window.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                touchEndY = e.changedTouches[0].screenY;
                handleSwipe();
            }, false);
        }

        function handleSwipe() {
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;
            const absX = Math.abs(dx);
            const absY = Math.abs(dy);

            if (Math.max(absX, absY) > 30) { // Threshold
                if (absX > absY) {
                    // Horizontal swipe
                    if (dx > 0) {
                        // Right
                        if (currentLane < 2) currentLane++;
                    } else {
                        // Left
                        if (currentLane > 0) currentLane--;
                    }
                } else {
                    // Vertical swipe
                    if (dy > 0) {
                        // Down
                        if (!isRolling) startRoll();
                    } else {
                        // Up
                        if (!isJumping) {
                            isJumping = true;
                            jumpVelocity = jumpForce;
                        }
                    }
                }
            }
        }

        function createPlayer() {
            const playerGroup = new THREE.Group();

            // Body
            const bodyGeo = new THREE.BoxGeometry(1, 2, 0.5);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1;
            body.castShadow = true;
            playerGroup.add(body);

            // Head
            const headGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc99 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.3;
            head.castShadow = true;
            playerGroup.add(head);

            player = playerGroup;
            player.position.set(LANES[currentLane], 0, 0);
            scene.add(player);
        }

        function handleKeyDown(event) {
            if (!gameRunning) return;
            switch(event.code) {
                case 'ArrowLeft':
                    if (currentLane > 0) currentLane--;
                    break;
                case 'ArrowRight':
                    if (currentLane < 2) currentLane++;
                    break;
                case 'ArrowUp':
                case 'Space':
                    if (!isJumping) {
                        isJumping = true;
                        jumpVelocity = jumpForce;
                    }
                    break;
                case 'ArrowDown':
                    if (!isRolling) {
                        startRoll();
                    }
                    break;
            }
        }

        function startRoll() {
            if (isJumping) return;
            isRolling = true;
            player.scale.y = 0.5;
            player.children[0].position.y = 0.5; // Body
            player.children[1].position.y = 1.15; // Head

            setTimeout(() => {
                isRolling = false;
                player.scale.y = 1;
                player.children[0].position.y = 1;
                player.children[1].position.y = 2.3;
            }, 1000);
        }

        function createEnvironment() {
            // Main ground
            const groundGeo = new THREE.PlaneGeometry(100, 1000);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x444444 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Lanes/Rails
            LANES.forEach(x => {
                const railGeo = new THREE.BoxGeometry(0.2, 0.1, 1000);
                const railMat = new THREE.MeshStandardMaterial({ color: 0x222222 });

                const leftRail = new THREE.Mesh(railGeo, railMat);
                leftRail.position.set(x - 0.7, 0.05, -450);
                scene.add(leftRail);

                const rightRail = new THREE.Mesh(railGeo, railMat);
                rightRail.position.set(x + 0.7, 0.05, -450);
                scene.add(rightRail);

                // Sleepers
                for(let i=0; i<200; i++) {
                    const sleeperGeo = new THREE.BoxGeometry(1.8, 0.05, 0.3);
                    const sleeper = new THREE.Mesh(sleeperGeo, railMat);
                    sleeper.position.set(x, 0.02, -i * 5);
                    scene.add(sleeper);
                }
            });

            // Side Walls
            const wallGeo = new THREE.BoxGeometry(1, 10, 1000);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
            const leftWall = new THREE.Mesh(wallGeo, wallMat);
            leftWall.position.set(-10, 5, -450);
            scene.add(leftWall);
            const rightWall = new THREE.Mesh(wallGeo, wallMat);
            rightWall.position.set(10, 5, -450);
            scene.add(rightWall);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function spawnObstacle() {
            const laneIndex = Math.floor(Math.random() * 3);
            const type = Math.random();
            let mesh;

            if (type < 0.3) {
                // Low Barrier (jump over)
                const group = new THREE.Group();
                const barGeo = new THREE.BoxGeometry(3.5, 0.5, 0.5);
                const barMat = new THREE.MeshStandardMaterial({ color: 0xffaa00 });
                const bar = new THREE.Mesh(barGeo, barMat);
                bar.position.y = 1;
                group.add(bar);

                const legGeo = new THREE.BoxGeometry(0.2, 1, 0.2);
                const legL = new THREE.Mesh(legGeo, barMat);
                legL.position.set(-1.5, 0.5, 0);
                group.add(legL);
                const legR = new THREE.Mesh(legGeo, barMat);
                legR.position.set(1.5, 0.5, 0);
                group.add(legR);

                mesh = group;
                mesh.position.set(LANES[laneIndex], 0, -100);
                mesh.userData = { type: 'barrier', height: 1.2 };
            } else if (type < 0.6) {
                // High Barrier (roll under)
                const group = new THREE.Group();
                const barGeo = new THREE.BoxGeometry(3.5, 1.5, 0.5);
                const barMat = new THREE.MeshStandardMaterial({ color: 0xff4400 });
                const bar = new THREE.Mesh(barGeo, barMat);
                bar.position.y = 2.5;
                group.add(bar);

                const legGeo = new THREE.BoxGeometry(0.2, 3, 0.2);
                const legL = new THREE.Mesh(legGeo, barMat);
                legL.position.set(-1.5, 1.5, 0);
                group.add(legL);
                const legR = new THREE.Mesh(legGeo, barMat);
                legR.position.set(1.5, 1.5, 0);
                group.add(legR);

                mesh = group;
                mesh.position.set(LANES[laneIndex], 0, -100);
                mesh.userData = { type: 'high_barrier', height: 3 };
            } else {
                // Train
                const group = new THREE.Group();
                const bodyGeo = new THREE.BoxGeometry(3.5, 4, 15);
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3333ff });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = 2;
                group.add(body);

                // Windows
                const winGeo = new THREE.PlaneGeometry(0.8, 1);
                const winMat = new THREE.MeshStandardMaterial({ color: 0x88ccff, emissive: 0x224466 });
                for(let i=0; i<4; i++) {
                    const winL = new THREE.Mesh(winGeo, winMat);
                    winL.position.set(-1.76, 2.5, -5 + i*3.3);
                    winL.rotation.y = -Math.PI/2;
                    group.add(winL);
                    const winR = new THREE.Mesh(winGeo, winMat);
                    winR.position.set(1.76, 2.5, -5 + i*3.3);
                    winR.rotation.y = Math.PI/2;
                    group.add(winR);
                }

                mesh = group;
                mesh.position.set(LANES[laneIndex], 0, -100);
                mesh.userData = { type: 'train', height: 4 };
            }

            mesh.traverse(child => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });
            scene.add(mesh);
            obstacles.push(mesh);
        }

        function spawnCoin() {
            const laneIndex = Math.floor(Math.random() * 3);
            const geo = new THREE.CylinderGeometry(0.5, 0.5, 0.1, 16);
            const mat = new THREE.MeshStandardMaterial({ color: 0xffff00, metalness: 0.8, roughness: 0.2 });
            const coin = new THREE.Mesh(geo, mat);
            coin.rotation.x = Math.PI / 2;
            coin.position.set(LANES[laneIndex], 1.5, -100);
            scene.add(coin);
            collectibleCoins.push(coin);
        }

        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('ui').style.display = 'flex';
            gameRunning = true;
            animate();
        }

        function restartGame() {
            location.reload(); // Simple reload for now
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('ui').style.display = 'none';
            document.getElementById('gameOverScreen').style.display = 'flex';
            document.getElementById('finalScore').innerText = Math.floor(score);
        }

        function checkCollision() {
            // Use a slightly smaller box for player to be more forgiving
            const playerBox = new THREE.Box3().setFromObject(player);
            playerBox.expandByVector(new THREE.Vector3(-0.2, -0.1, -0.2));

            // Obstacles
            for (let i = 0; i < obstacles.length; i++) {
                const obstacle = obstacles[i];
                const obstacleBox = new THREE.Box3().setFromObject(obstacle);

                if (playerBox.intersectsBox(obstacleBox)) {
                    // Special case for rolling under high barriers
                    if (isRolling && obstacle.userData.type === 'high_barrier') {
                        // Pass through if rolling
                        continue;
                    }
                    gameOver();
                    return;
                }
            }

            // Coins
            for (let i = collectibleCoins.length - 1; i >= 0; i--) {
                const coinBox = new THREE.Box3().setFromObject(collectibleCoins[i]);
                if (playerBox.intersectsBox(coinBox)) {
                    scene.remove(collectibleCoins[i]);
                    collectibleCoins.splice(i, 1);
                    coins++;
                    document.getElementById('coins').innerText = coins;
                }
            }
        }

        function animate() {
            if (!gameRunning) return;
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            // Player movement
            player.position.x += (LANES[currentLane] - player.position.x) * 0.2;

            if (isJumping) {
                player.position.y += jumpVelocity;
                jumpVelocity -= gravity;
                if (player.position.y <= 0) {
                    player.position.y = 0;
                    isJumping = false;
                    jumpVelocity = 0;
                }
            }

            // Spawning
            spawnTimer += delta;
            if (spawnTimer > 1.5) {
                if (Math.random() > 0.3) spawnObstacle();
                else spawnCoin();
                spawnTimer = 0;
            }

            // Move Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].position.z += speed * delta;
                if (obstacles[i].position.z > 10) {
                    scene.remove(obstacles[i]);
                    obstacles.splice(i, 1);
                }
            }

            // Move Coins
            for (let i = collectibleCoins.length - 1; i >= 0; i--) {
                collectibleCoins[i].position.z += speed * delta;
                collectibleCoins[i].rotation.y += 0.05;
                if (collectibleCoins[i].position.z > 10) {
                    scene.remove(collectibleCoins[i]);
                    collectibleCoins.splice(i, 1);
                }
            }

            checkCollision();

            // Basic movement (mocking speed)
            score += 10 * delta;
            document.getElementById('score').innerText = Math.floor(score);

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
